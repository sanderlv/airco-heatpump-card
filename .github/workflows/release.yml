name: Release

# Runs when a release is published on GitHub (Releases → Draft a new release → tag vX.Y.Z → Publish).
# Checks that the tag matches CARD_VERSION in the card, fills the release notes from CHANGELOG.md
# and attaches the card file to the release.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the card version
        run: |
          card=$(grep -oP 'CARD_VERSION = "\K[^"]+' airco-heatpump-card.js)
          if [ "${TAG#v}" != "$card" ]; then
            echo "::error::Tag $TAG does not match CARD_VERSION $card"
            exit 1
          fi

      - name: Take the release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No section for $TAG in CHANGELOG.md"
            exit 1
          fi
          gh release edit "$TAG" --notes-file notes.md

      - name: Attach the card file
        run: gh release upload "$TAG" airco-heatpump-card.js --clobber
